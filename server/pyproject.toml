[project]
name = "botteam-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "aiosqlite",
  "httpx",
  "pydantic",
  "sse-starlette",
  "tzdata",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "asgi-lifespan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
