[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botteam-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "python-multipart>=0.0.20",
  "uvicorn[standard]",
  "aiosqlite",
  "httpx",
  "pydantic",
  "sse-starlette",
  "tzdata",
  "pyyaml>=6.0.3",
  "playwright>=1.65.0",
]

[project.optional-dependencies]
computer = ["e2b-desktop==2.7.2 ; python_full_version >= '3.11'", "opensandbox>=1.2.1", "pillow>=11"]

[project.scripts]
botteam = "botteam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["botteam"]
artifacts = ["botteam/webui/**", "botteam/templates/**", "botteam/skill_gallery/**"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "asgi-lifespan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
