[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botteam-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "aiosqlite",
  "httpx",
  "pydantic",
  "sse-starlette",
  "tzdata",
  "pyyaml>=6.0.3",
]

[project.scripts]
botteam = "botteam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["botteam"]
artifacts = ["botteam/webui/**"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "asgi-lifespan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
